services:
  watcher-pilot:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    image: agent-core/watcher-pilot:latest
    container_name: watcher-pilot
    user: "1001:1001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/agent/.npm:size=16m,mode=0755
    environment:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      ANTHROPIC_CONSOLE_KEY: ""
      HOME: /home/agent
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/agent-core:/app"
      OP_SERVICE_ACCOUNT_TOKEN_FILE: "/run/secrets/op-sa-token"
    volumes:
      - type: bind
        source: ${HOME}/.claude
        target: /home/agent/.claude
        read_only: false
      - type: bind
        source: ${HOME}/.claude.json
        target: /home/agent/.claude.json
        read_only: false
      - type: bind
        source: ${HOME}/Projects/anthropic-update-watcher
        target: /app
        read_only: true
      - type: bind
        source: ${HOME}/Projects/agent-core
        target: /agent-core
        read_only: true
      - type: bind
        source: ${HOME}/.config/op-service-account-token
        target: /run/secrets/op-sa-token
        read_only: true
    working_dir: /app
    networks:
      - default

networks:
  default:
    driver: bridge
