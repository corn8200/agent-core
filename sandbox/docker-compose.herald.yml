services:
  herald:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    image: agent-core/watcher-pilot:latest
    container_name: sandbox-herald
    user: "1001:1001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/agent/.npm:size=16m,mode=0755,uid=1001,gid=1001
      - /home/agent/logs:size=16m,mode=0755,uid=1001,gid=1001
    environment:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      ANTHROPIC_CONSOLE_KEY: ""
      HOME: /home/agent
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/agent-core:/job-agent:/app"
      OP_SERVICE_ACCOUNT_TOKEN_FILE: "/run/secrets/op-sa-token"
      HERALD_MCP_CONFIG: "/agent-core/sandbox/mcp-empty.json"
    volumes:
      - type: bind
        source: ${HOME}/.claude
        target: /home/agent/.claude
        read_only: false
      - type: bind
        source: ${HOME}/.claude.json
        target: /home/agent/.claude.json
        read_only: false
      - type: bind
        source: ${HOME}/bin
        target: /app
        read_only: true
      - type: bind
        source: ${HOME}/Projects/agent-core
        target: /agent-core
        read_only: true
      - type: bind
        source: ${HOME}/Projects/job-agent
        target: /job-agent
        read_only: true
      - type: bind
        source: ${HOME}/Projects/brand-kit
        target: /brand-kit
        read_only: false
      - type: bind
        source: ${HOME}/.config/op-service-account-token
        target: /run/secrets/op-sa-token
        read_only: true
      - type: bind
        source: ${HOME}/Projects/agent-core/sandbox/herald-container-entrypoint.sh
        target: /usr/local/bin/herald-sandbox-run
        read_only: true
    working_dir: /app
    command: ["bash", "/usr/local/bin/herald-sandbox-run"]
    networks:
      - default

networks:
  default:
    driver: bridge
