[project]
name = "agent-core"
version = "0.1.0"
description = "Claude Agent SDK integration for John's automation stack"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.50",
    "anyio>=4.0",
    "fastapi>=0.100",
    "httpx>=0.28",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "playwright>=1.58.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "briefs*", "swarm*", "handler*"]
