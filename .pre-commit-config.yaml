repos:
  - repo: local
    hooks:
      - id: usage-cache-ban
        name: Ban direct usage-cache.json reads
        entry: /Users/johncornelius/claude-config/hooks/usage-cache-direct-read-ban.sh
        language: script
        types_or: [python, shell]
        pass_filenames: true
      - id: opjune-raw-call-scanner
        name: OpJune raw Anthropic/Claude call scanner
        entry: python .opjune/raw-call-scanner.py .
        language: system
        pass_filenames: false
        always_run: true
